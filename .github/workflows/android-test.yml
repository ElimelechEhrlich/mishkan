name: Android app check

# Builds variants of the Android app with a throwaway key and opens each on an Android
# emulator (twice): whether it starts, why not (the crash, from the log), and which shortcuts the
# launcher gets. Nothing is published. Used to try a change before it reaches a phone.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Version 10 as published: three shortcuts and the site settings entry.
          - variant: as-published
            shortcuts: 3
            remove_site_settings: false
          # The site settings screen kept, its shortcut removed by the app once it starts,
          # and four of the app's own.
          - variant: shortcut-removed-on-start
            shortcuts: 4
            remove_site_settings: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @bubblewrap/cli@1.25.0

      - name: Android SDK
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "build-tools;36.1.0" "platforms;android-36" > /dev/null
          sudo ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"

      - name: Prepare the variant
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.bubblewrap" build
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" \
            > "$HOME/.bubblewrap/config.json"
          keytool -genkeypair -keystore build/android.keystore -alias test -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass testtest -keypass testtest \
            -dname "CN=Test" -noprompt
          # The four shortcuts of the web app, as many as the variant takes.
          jq --argjson count '${{ matrix.shortcuts }}' '
            .signingKey.alias = "test"
            | .appVersionCode = 100
            | .shortcuts = ([
                {name: "רשימת קניות", shortName: "רשימת קניות", url: "https://mishkan.vercel.app/?new=shopping", chosenIconUrl: "https://mishkan.vercel.app/icons/shortcut-shopping.png"},
                {name: "פריט חדש", shortName: "פריט חדש", url: "https://mishkan.vercel.app/?new=1", chosenIconUrl: "https://mishkan.vercel.app/icons/shortcut-new.png"},
                {name: "היום", shortName: "היום", url: "https://mishkan.vercel.app/today", chosenIconUrl: "https://mishkan.vercel.app/icons/shortcut-today.png"},
                {name: "שיחה", shortName: "שיחה", url: "https://mishkan.vercel.app/assistant", chosenIconUrl: "https://mishkan.vercel.app/icons/shortcut-chat.png"}
              ] | .[0:$count])' \
            .github/twa-manifest.json > build/twa-manifest.json

      - name: Build
        working-directory: build
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: testtest
          BUBBLEWRAP_KEY_PASSWORD: testtest
        run: |
          set -euo pipefail
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          if [ "${{ matrix.remove_site_settings }}" = "true" ]; then
            python3 ../.github/scripts/remove-site-settings-shortcut.py
          fi
          if ! bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json > build.log 2>&1; then
            grep -E "ERROR|What went wrong" -A6 build.log | head -40
            exit 1
          fi
          ls -la app-release-signed.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open it on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r build/app-release-signed.apk
            adb logcat -c
            adb shell am start -W -n app.vercel.mishkan.twa/.LauncherActivity
            sleep 20
            echo "=== second launch"
            adb shell am force-stop app.vercel.mishkan.twa
            adb shell am start -W -n app.vercel.mishkan.twa/.LauncherActivity
            sleep 15
            echo "=== running: $(adb shell pidof app.vercel.mishkan.twa || echo NO)"
            echo "=== crash"; adb logcat -d -b crash | head -60 || true
            echo "=== errors"; adb logcat -d '*:E' | grep -i -E 'mishkan|AndroidRuntime|FATAL' | head -40 || true
            echo "=== shortcuts"; adb shell dumpsys shortcut | grep -A40 'Package: app.vercel.mishkan.twa' | grep -E 'Package:|ShortcutInfo|id=|shortLabel|flags' | head -40 || true
